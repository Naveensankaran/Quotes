<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Proposal and Quotation</title>
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; font-size: 13px; color: #333; }
    .field-row { margin-bottom: 14px; max-width: 340px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    input[disabled], select[disabled] { background: #f5f5f5; color: #666; }
    h4 { margin: 18px 0 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 5px; text-align: left; }
    th { background: #fafafa; white-space: nowrap; }
    td input, td select { padding: 4px 6px; font-size: 12px; }
    td.remove-cell { text-align: center; width: 30px; }
    .remove-btn {
      width: 22px; height: 22px; border-radius: 50%; border: 1px solid #c00; color: #c00;
      background: white; cursor: pointer; font-weight: bold; line-height: 1; padding: 0;
    }
    #addRowBtn {
      margin-top: 8px; padding: 6px 12px; border: 1px solid #1a73e8; color: #1a73e8;
      background: white; border-radius: 4px; cursor: pointer;
    }
    .totals-wrap { display: flex; justify-content: flex-end; margin-top: 18px; }
    .totals-box { width: 260px; }
    .totals-box .field-row { max-width: none; display: flex; align-items: center; justify-content: space-between; }
    .totals-box label { margin-bottom: 0; }
    .totals-box input { width: 140px; text-align: right; }
    .actions { margin-top: 22px; text-align: right; }
    .actions button { padding: 8px 18px; border-radius: 4px; border: none; cursor: pointer; margin-left: 8px; }
    #saveBtn { background: #1a73e8; color: white; }
    #cancelBtn { background: #eee; color: #333; }
    #status { margin-top: 10px; font-size: 12px; color: #c00; min-height: 16px; }
  </style>
</head>
<body>

  <div class="field-row">
    <label>Subject</label>
    <input type="text" id="subject" />
  </div>

  <div class="field-row">
    <label>Project (from Lead)</label>
    <input type="text" id="projectDisplay" disabled />
  </div>

  <h4>Quoted Items</h4>
  <table id="itemsTable">
    <thead>
      <tr>
        <th>Tower</th>
        <th>Floor</th>
        <th>Unit Name</th>
        <th>List Price (Rs.)</th>
        <th>Discount (Rs.)</th>
        <th>Tax (Rs.)</th>
        <th>Total (Rs.)</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="itemRows"></tbody>
  </table>
  <button id="addRowBtn" type="button">+ Add row</button>

  <div class="totals-wrap">
    <div class="totals-box">
      <div class="field-row"><label>Sub Total (Rs.)</label><input type="number" id="subTotal" value="0" disabled /></div>
      <div class="field-row"><label>Discount (Rs.)</label><input type="number" id="discountTotal" value="0" disabled /></div>
      <div class="field-row"><label>Tax (Rs.)</label><input type="number" id="taxTotal" value="0" disabled /></div>
      <div class="field-row"><label>Adjustment (Rs.)</label><input type="number" id="adjustment" value="0" /></div>
      <div class="field-row"><label>Grand Total (Rs.)</label><input type="number" id="grandTotal" value="0" disabled /></div>
    </div>
  </div>

  <div id="status"></div>

  <div class="actions">
    <button id="cancelBtn" type="button">Cancel</button>
    <button id="saveBtn" type="button">Save</button>
  </div>

<script>
// TODO: replace with the real api_name from the findleadfield() Deluge script above
var LEAD_LOOKUP_API_NAME = "Lead";

var leadEntityId = null;
var leadProject = null;   // { id, name }
var towerCache = [];      // towers for this Project

ZOHO.embeddedApp.on("PageLoad", function (data) {
  leadEntityId = data.EntityId;
  loadLeadProject();
});
ZOHO.embeddedApp.init();

function loadLeadProject() {
  ZOHO.CRM.API.getRecord({ Entity: "Leads", RecordID: leadEntityId })
    .then(function (res) {
      var lead = res.data[0];
      var proj = lead.Project;
      if (proj) {
        leadProject = { id: proj.id, name: proj.name };
        document.getElementById("projectDisplay").value = proj.name;
        loadTowersForProject(proj.id);
      } else {
        document.getElementById("projectDisplay").value = "(no project on lead)";
      }
      addRow();
    })
    .catch(function (err) {
      showStatus("Could not load Lead: " + JSON.stringify(err));
    });
}

function loadTowersForProject(projectId) {
  ZOHO.CRM.API.searchRecord({
    Entity: "Tower",
    Type: "criteria",
    Query: "(Project:equals:" + projectId + ")"
  }).then(function (res) {
    towerCache = res.data || [];
    document.querySelectorAll(".row-tower").forEach(populateTowerSelect);
  }).catch(function (err) {
    showStatus("Could not load Towers: " + JSON.stringify(err));
  });
}

function populateTowerSelect(select) {
  select.innerHTML = '<option value="">-- select tower --</option>';
  towerCache.forEach(function (t) {
    var opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.Name || t.Tower_Name || t.id;
    select.appendChild(opt);
  });
}

function loadFloorsForTower(projectId, towerId, floorSelect) {
  floorSelect.innerHTML = '<option value="">-- loading --</option>';
  ZOHO.CRM.API.searchRecord({
    Entity: "Floor",
    Type: "criteria",
    Query: "((Project:equals:" + projectId + ")and(Tower_Name:equals:" + towerId + "))"
  }).then(function (res) {
    var floors = res.data || [];
    floorSelect.innerHTML = '<option value="">-- select floor --</option>';
    floors.forEach(function (f) {
      var opt = document.createElement("option");
      opt.value = f.id;
      opt.textContent = f.Name || f.Floor_Name || f.id;
      floorSelect.appendChild(opt);
    });
  }).catch(function (err) {
    floorSelect.innerHTML = '<option value="">-- error loading --</option>';
    showStatus("Could not load Floors: " + JSON.stringify(err));
  });
}

function loadUnitsForFloor(projectId, towerId, floorId, unitSelect) {
  unitSelect.innerHTML = '<option value="">-- loading --</option>';
  ZOHO.CRM.API.searchRecord({
    Entity: "Products",
    Type: "criteria",
    Query: "((Project:equals:" + projectId + ")and(Tower:equals:" + towerId + ")and(Floor:equals:" + floorId + "))"
  }).then(function (res) {
    var units = res.data || [];
    unitSelect.innerHTML = '<option value="">-- select unit --</option>';
    units.forEach(function (u) {
      var opt = document.createElement("option");
      opt.value = u.id;
      opt.textContent = u.Name || u.Product_Name || u.id;
      opt.dataset.price = u.Unit_Price || 0;
      unitSelect.appendChild(opt);
    });
  }).catch(function (err) {
    unitSelect.innerHTML = '<option value="">-- error loading --</option>';
    showStatus("Could not load Units: " + JSON.stringify(err));
  });
}

function addRow() {
  var tbody = document.getElementById("itemRows");
  var row = document.createElement("tr");
  var isFirstRow = tbody.children.length === 0;

  row.innerHTML =
    '<td><select class="row-tower"><option value="">-- select tower --</option></select></td>' +
    '<td><select class="row-floor" disabled><option value="">-- select tower first --</option></select></td>' +
    '<td><select class="row-unit" disabled><option value="">-- select floor first --</option></select></td>' +
    '<td><input class="row-listprice" type="number" value="0" disabled /></td>' +
    '<td><input class="row-discount" type="number" value="0" /></td>' +
    '<td><input class="row-tax" type="number" value="0" /></td>' +
    '<td><input class="row-total" type="number" value="0" disabled /></td>' +
    '<td class="remove-cell">' + (isFirstRow ? "" : '<button class="remove-btn" type="button" title="Remove row">-</button>') + '</td>';

  tbody.appendChild(row);

  var towerSelect = row.querySelector(".row-tower");
  var floorSelect = row.querySelector(".row-floor");
  var unitSelect = row.querySelector(".row-unit");
  var listPriceInput = row.querySelector(".row-listprice");
  var discountInput = row.querySelector(".row-discount");
  var taxInput = row.querySelector(".row-tax");

  populateTowerSelect(towerSelect);

  towerSelect.addEventListener("change", function () {
    floorSelect.innerHTML = '<option value="">-- select floor --</option>';
    unitSelect.innerHTML = '<option value="">-- select floor first --</option>';
    unitSelect.disabled = true;
    resetRowPricing(row);
    if (towerSelect.value && leadProject) {
      floorSelect.disabled = false;
      loadFloorsForTower(leadProject.id, towerSelect.value, floorSelect);
    } else {
      floorSelect.disabled = true;
    }
  });

  floorSelect.addEventListener("change", function () {
    unitSelect.innerHTML = '<option value="">-- select unit --</option>';
    resetRowPricing(row);
    if (floorSelect.value && leadProject && towerSelect.value) {
      unitSelect.disabled = false;
      loadUnitsForFloor(leadProject.id, towerSelect.value, floorSelect.value, unitSelect);
    } else {
      unitSelect.disabled = true;
    }
  });

  unitSelect.addEventListener("change", function () {
    var selectedOpt = unitSelect.options[unitSelect.selectedIndex];
    var price = selectedOpt ? parseFloat(selectedOpt.dataset.price) || 0 : 0;
    listPriceInput.value = price;
    recalcRow(row);
  });

  discountInput.addEventListener("input", function () { recalcRow(row); });
  taxInput.addEventListener("input", function () { recalcRow(row); });

  var removeBtn = row.querySelector(".remove-btn");
  if (removeBtn) {
    removeBtn.addEventListener("click", function () {
      row.remove();
      recalcGrandTotal();
    });
  }
}
document.getElementById("addRowBtn").addEventListener("click", addRow);

function resetRowPricing(row) {
  row.querySelector(".row-listprice").value = 0;
  recalcRow(row);
}

function recalcRow(row) {
  var listPrice = parseFloat(row.querySelector(".row-listprice").value) || 0;
  var discount = parseFloat(row.querySelector(".row-discount").value) || 0;
  var tax = parseFloat(row.querySelector(".row-tax").value) || 0;

  var total = listPrice - discount + tax;
  row.querySelector(".row-total").value = total.toFixed(2);

  recalcGrandTotal();
}

function recalcGrandTotal() {
  var rows = document.querySelectorAll("#itemRows tr");
  var subTotal = 0, discountTotal = 0, taxTotal = 0;

  rows.forEach(function (row) {
    subTotal += parseFloat(row.querySelector(".row-listprice").value) || 0;
    discountTotal += parseFloat(row.querySelector(".row-discount").value) || 0;
    taxTotal += parseFloat(row.querySelector(".row-tax").value) || 0;
  });

  var adjustment = parseFloat(document.getElementById("adjustment").value) || 0;
  var grandTotal = subTotal - discountTotal + taxTotal + adjustment;

  document.getElementById("subTotal").value = subTotal.toFixed(2);
  document.getElementById("discountTotal").value = discountTotal.toFixed(2);
  document.getElementById("taxTotal").value = taxTotal.toFixed(2);
  document.getElementById("grandTotal").value = grandTotal.toFixed(2);
}
document.getElementById("adjustment").addEventListener("input", recalcGrandTotal);

document.getElementById("cancelBtn").addEventListener("click", function () {
  ZOHO.CRM.UI.Popup.close();
});

document.getElementById("saveBtn").addEventListener("click", function () {
  var subject = document.getElementById("subject").value.trim();
  if (!subject) { showStatus("Subject is required."); return; }
  if (!leadProject) { showStatus("No Project found on the Lead — cannot proceed."); return; }

  var rows = document.querySelectorAll("#itemRows tr");
  var quotedItems = [];
  var productDetailsItems = [];
  var missingSelection = false;

  rows.forEach(function (row) {
    var towerVal = row.querySelector(".row-tower").value;
    var floorVal = row.querySelector(".row-floor").value;
    var unitVal = row.querySelector(".row-unit").value;
    if (!towerVal || !floorVal || !unitVal) { missingSelection = true; }

    var listPrice = parseFloat(row.querySelector(".row-listprice").value) || 0;

    quotedItems.push({
      Product_Name: { id: unitVal },
      Tower: { id: towerVal },
      Floor: { id: floorVal },
      Quantity: 1,
      List_Price: listPrice,
      Discount: parseFloat(row.querySelector(".row-discount").value) || 0,
      Tax: parseFloat(row.querySelector(".row-tax").value) || 0
    });

    productDetailsItems.push({
      product: { id: unitVal },
      quantity: 1,
      list_price: listPrice
    });
  });

  if (missingSelection) {
    showStatus("Please select Tower, Floor and Unit on every row before saving.");
    return;
  }

  var recordData = {
    Subject: subject,
    Quoted_Items: quotedItems,
    Product_Details: productDetailsItems,
    Adjustment: parseFloat(document.getElementById("adjustment").value) || 0
  };
  recordData[LEAD_LOOKUP_API_NAME] = { id: leadEntityId };

  ZOHO.CRM.API.insertRecord({ Entity: "Quotes", APIData: recordData })
    .then(function () {
      showStatus("Quote created successfully.");
      ZOHO.CRM.UI.Popup.close();
    })
    .catch(function (err) {
      showStatus("Save failed: " + JSON.stringify(err));
    });
});

function showStatus(msg) {
  document.getElementById("status").innerText = msg;
}
</script>

</body>
</html>
